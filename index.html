<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>語音訪視紀錄</title>
    <link
      rel="icon"
      href="https://scrm.oakmega.site/0/icon/logo.ico"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://scrm.oakmega.site/0/css/primeicons.css" />
    <link rel="stylesheet" href="https://scrm.oakmega.site/0/css/primeflex.css" />
    <style>
      :root {
        font-size: 18px;
        --background: #f7f3ee;
        --foreground: #352b25;
        --card: #fffdfa;
        --muted: #f1e8de;
        --muted-foreground: #75665a;
        --border: #decbbb;
        --primary: #895b45;
        --primary-dark: #6c4939;
        --danger: #b42318;
        --radius: 0.625rem;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }
      [v-cloak] {
        display: none;
      }
      body {
        margin: 0;
        font-family: "Noto Sans TC", system-ui, -apple-system, "Helvetica Neue",
          Arial, sans-serif;
        color: var(--foreground);
        background: #ede7e0;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        touch-action: manipulation;
      }

      .app-shell {
        min-height: 100vh;
        min-height: 100dvh;
        min-width: 0;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        position: relative;
        overflow-x: hidden;
        background: var(--background);
      }
      .main-content {
        width: 100%;
        min-width: 0;
        padding: 1rem 0.875rem;
      }
      .view-stack {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .content-card {
        min-width: 0;
        padding: 1rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 0.25rem);
        box-shadow: 0 3px 12px rgba(86, 57, 45, 0.04);
        overflow-wrap: anywhere;
      }
      .field {
        min-width: 0;
      }
      .field label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.86rem;
        font-weight: 500;
      }
      .required-mark {
        color: var(--danger);
        font-weight: 500;
      }
      .field-hint {
        margin-top: 0.35rem;
        color: var(--muted-foreground);
        font-size: 0.78rem;
      }
      .field-error {
        margin-top: 0.35rem;
        color: var(--danger);
        font-size: 0.8rem;
      }
      .audio-panel {
        padding: 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        background: var(--muted);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
      }
      .audio-panel__status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--muted-foreground);
        font-size: 0.84rem;
      }
      .audio-panel__status--recording {
        color: var(--danger);
        font-weight: 500;
      }
      .audio-panel__actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.55rem;
      }
      .audio-panel__actions .p-button {
        width: 100%;
        min-height: 2.75rem;
      }
      .audio-panel audio {
        width: 100%;
        max-width: 100%;
      }
      .audio-file-input {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      .audio-file-trigger {
        width: 100%;
        min-height: 2.75rem;
      }
      .diagnostics { margin-top: 1rem; }
      .diagnostics h2 { font-size: 1rem; margin-bottom: 0.5rem; }
      .diagnostics dl { margin: 0; font-size: 0.78rem; }
      .diagnostics dt { font-weight: 600; margin-top: 0.5rem; }
      .diagnostics dd { margin: 0; overflow-wrap: anywhere; }
      .diagnostics__actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.8rem; }
      .diagnostics pre, .diagnostics textarea {
        width: 100%; font: 0.78rem/1.6 monospace; white-space: pre-wrap;
        overflow-wrap: anywhere; background: var(--muted); color: var(--foreground);
        border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem;
      }
      .diagnostics pre { max-height: 22rem; overflow: auto; margin-bottom: 0; }
      .diagnostics textarea { min-height: 12rem; margin-top: 0.5rem; }
      .diagnostics__error { white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 767px) {
        :root { font-size: 16px; }
        .main-content { padding: 1rem 0.75rem; }
        .audio-panel__actions { grid-template-columns: 1fr; }
      }
      @media (min-width: 601px) {
        .app-shell { box-shadow: 0 0 28px rgba(86, 57, 45, 0.1); }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell" v-cloak>
      <main class="main-content">
        <div class="content-card form-section">
              <div class="field">
                <label>訪視錄音<span class="required-mark">（必填）</span></label>
                <div class="audio-panel">
                  <p
                    v-if="isRecording"
                    class="audio-panel__status audio-panel__status--recording"
                    role="status"
                  >
                    <i class="pi pi-circle-fill" aria-hidden="true"></i>
                    錄音中 {{ recordingDurationLabel }}
                  </p>
                  <p v-else class="audio-panel__status" role="status">
                    <i class="pi pi-microphone" aria-hidden="true"></i>
                    {{ audioStatusMessage }}
                  </p>

                  <div class="audio-panel__actions">
                    <p-button
                      v-if="!isRecording"
                      :label="hasAudio ? '重新錄音' : '開始錄音'"
                      icon="pi pi-microphone"
                      :loading="isRequestingMicrophone"
                      :disabled="isRequestingMicrophone || !canRecordAudio"
                      @click="startRecording"
                    ></p-button>
                    <p-button
                      v-else
                      label="停止錄音"
                      icon="pi pi-stop"
                      severity="danger"
                      @click="stopRecording"
                    ></p-button>
                    <div class="audio-upload-action">
                      <input
                        id="visit-audio-file"
                        ref="audioFileInput"
                        class="audio-file-input"
                        type="file"
                        accept="audio/*"
                        tabindex="-1"
                        :disabled="isRequestingMicrophone || isRecording"
                        @change="selectAudioFile"
                      />
                      <p-button
                        class="audio-file-trigger"
                        type="button"
                        label="上傳音檔"
                        icon="pi pi-upload"
                        severity="secondary"
                        outlined
                        :disabled="isRequestingMicrophone || isRecording"
                        @click="openAudioFilePicker"
                      ></p-button>
                    </div>
                  </div>

                  <p v-if="!canRecordAudio" class="field-hint">
                    此瀏覽器不支援錄音，請改用音檔上傳。
                  </p>
                  <p v-if="audioFilename" class="field-hint">
                    目前音檔：{{ audioFilename }}
                  </p>
                  <audio
                    v-if="audioObjectUrl"
                    :src="audioObjectUrl"
                    controls
                    preload="metadata"
                    @error="recordPlaybackError"
                  >
                    您的瀏覽器不支援音檔播放。
                  </audio>
                  <p v-if="audioErrorMessage" class="field-error" role="alert">
                    {{ audioErrorMessage }}
                  </p>
                </div>
              </div>

        </div>
        <section class="content-card diagnostics" aria-labelledby="diagnostics-title">
          <h2 id="diagnostics-title">測試診斷</h2>
          <p class="field-hint">紀錄只保留在目前頁面，不會傳送至伺服器。錯誤名稱不代表已確定原因。</p>
          <dl>
            <template v-for="item in diagnosticEnvironment" :key="item.label">
              <dt>{{ item.label }}</dt>
              <dd>{{ item.value }}</dd>
            </template>
          </dl>
          <p v-if="latestDiagnosticError" class="field-error diagnostics__error" role="status">最近一次錯誤：{{ latestDiagnosticError }}</p>
          <div class="diagnostics__actions">
            <p-button type="button" label="複製診斷資訊" icon="pi pi-copy" severity="secondary" outlined @click="copyDiagnostics"></p-button>
            <p-button type="button" label="清除紀錄" icon="pi pi-trash" severity="secondary" outlined @click="clearDiagnostics"></p-button>
          </div>
          <p v-if="diagnosticCopyStatus" class="field-hint" role="status">{{ diagnosticCopyStatus }}</p>
          <textarea v-if="manualCopyText" :value="manualCopyText" readonly aria-label="可手動複製的診斷資訊"></textarea>
          <pre aria-label="測試步驟與錯誤紀錄">{{ diagnosticLogText }}</pre>
        </section>
      </main>
    </div>
    <script src="https://scrm.oakmega.site/0/js/vue3.prod.js"></script>
    <script src="https://scrm.oakmega.site/0/js/primevue.min.js"></script>
    <script src="https://scrm.oakmega.site/0/js/lara.js"></script>
    <script>
      const { createApp, computed, onBeforeUnmount, onMounted, ref } = Vue;
      function trimmed(value) {
        return typeof value === "string" ? value.trim() : "";
      }
      const app = createApp({
        setup() {
          const isRequestingMicrophone = ref(false);
          const isRecording = ref(false);
          const recordingSeconds = ref(0);
          const audioBlob = ref(null);
          const audioFileInput = ref(null);
          const audioObjectUrl = ref("");
          const audioFilename = ref("");
          const audioMimeType = ref("");
          const audioErrorMessage = ref("");
          const canRecordAudio = Boolean(
            window.MediaRecorder &&
              navigator.mediaDevices &&
              typeof navigator.mediaDevices.getUserMedia === "function"
          );
          let mediaRecorder = null;
          let mediaStream = null;
          let recordingTimerId = null;
          let mediaRequestId = 0;
          let isComponentActive = true;

          const diagnosticEntries = ref([]);
          const latestDiagnosticError = ref("");
          const diagnosticCopyStatus = ref("");
          const manualCopyText = ref("");
          const diagnosticEnvironment = [
            { label: "網頁協定", value: window.location.protocol },
            { label: "安全環境", value: window.isSecureContext ? "是" : "否" },
            { label: "getUserMedia", value: navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function" ? "支援" : "不支援" },
            { label: "MediaRecorder", value: window.MediaRecorder ? "支援" : "不支援" },
            { label: "錄音格式檢查", value: window.MediaRecorder && typeof MediaRecorder.isTypeSupported === "function" ? "支援" : "未提供，使用瀏覽器預設格式" },
            { label: "瀏覽器資訊", value: navigator.userAgent || "未提供" },
          ];
          const diagnosticLogText = computed(() => diagnosticEntries.value.join("\n\n") || "尚無測試紀錄");
          const diagnosticText = computed(() => [
            "錄音測試診斷",
            ...diagnosticEnvironment.map(item => `${item.label}：${item.value}`),
            "", diagnosticLogText.value,
          ].join("\n"));

          function addDiagnostic(stage, detail = "", error = null) {
            let message = `${new Date().toLocaleTimeString("zh-TW", { hour12: false })} ${stage}`;
            if (detail) message += `：${detail}`;
            if (error) {
              const errorDetail = `錯誤名稱：${error.name || "UnknownError"}\n原始訊息：${error.message || "未提供"}`;
              message += `\n${errorDetail}`;
              latestDiagnosticError.value = `${stage}${detail ? `（${detail}）` : ""}\n${errorDetail}`;
            }
            diagnosticEntries.value = [...diagnosticEntries.value, message].slice(-100);
            diagnosticCopyStatus.value = "";
            manualCopyText.value = "";
          }

          function diagnosticWarning(stage, ...details) {
            console.warn(stage, ...details);
            const error = details.find(value => value && typeof value === "object");
            const detail = details.filter(value => typeof value === "string").join(" ");
            addDiagnostic(stage.replace(/^\[錄音\]\s*/, ""), detail, error || { name: "UnknownError", message: "未提供" });
          }

          async function copyDiagnostics() {
            const text = diagnosticText.value;
            try {
              if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function")
                throw new Error("瀏覽器未提供剪貼簿功能");
              await navigator.clipboard.writeText(text);
              diagnosticCopyStatus.value = "診斷資訊已複製。";
              manualCopyText.value = "";
            } catch (_) {
              manualCopyText.value = text;
              diagnosticCopyStatus.value = "無法自動複製，請長按下方文字框，選取全部後複製。";
            }
          }

          function clearDiagnostics() {
            diagnosticEntries.value = [];
            latestDiagnosticError.value = "";
            diagnosticCopyStatus.value = "";
            manualCopyText.value = "";
          }

          function recordPlaybackError(event) {
            const error = event.target && event.target.error;
            if (!error) return;
            addDiagnostic("播放音檔失敗", `MediaError 代碼 ${error.code}`, {
              name: "MediaError",
              message: error.message || "瀏覽器未提供播放失敗原因",
            });
          }

          const hasAudio = computed(
            () => audioBlob.value instanceof Blob && audioBlob.value.size > 0
          );
          const recordingDurationLabel = computed(() => {
            const minutes = Math.floor(recordingSeconds.value / 60);
            const seconds = recordingSeconds.value % 60;
            return `${String(minutes).padStart(2, "0")}:${String(
              seconds
            ).padStart(2, "0")}`;
          });
          const audioStatusMessage = computed(() => {
            if (isRequestingMicrophone.value) return "正在等待麥克風權限";
            if (hasAudio.value) return "音檔已準備，可先試聽";
            return canRecordAudio ? "尚未錄音" : "請上傳音檔";
          });

          function stopMediaTracks() {
            if (!mediaStream) return;
            mediaStream.getTracks().forEach((track) => track.stop());
            mediaStream = null;
          }

          function stopRecordingTimer() {
            if (recordingTimerId === null) return;
            window.clearInterval(recordingTimerId);
            recordingTimerId = null;
          }

          function revokeAudioObjectUrl() {
            if (!audioObjectUrl.value) return;
            URL.revokeObjectURL(audioObjectUrl.value);
            audioObjectUrl.value = "";
          }

          function resetAudioSelection() {
            revokeAudioObjectUrl();
            audioBlob.value = null;
            audioFilename.value = "";
            audioMimeType.value = "";
          }

          function setAudioSelection(blob, filename, mimeType) {
            revokeAudioObjectUrl();
            audioBlob.value = blob;
            audioFilename.value = filename;
            audioMimeType.value = mimeType;
            audioObjectUrl.value = URL.createObjectURL(blob);
            audioErrorMessage.value = "";
            addDiagnostic("顯示音檔", `成功，格式 ${mimeType}，大小 ${blob.size} bytes`);
          }

          function recordingMimeTypes() {
            const candidates = [
              "audio/webm;codecs=opus",
              "audio/webm",
              "audio/mp4",
              "audio/ogg;codecs=opus",
            ];
            // 缺少格式檢查時，不猜測支援格式，交由瀏覽器決定。
            if (typeof MediaRecorder.isTypeSupported !== "function") {
              addDiagnostic("格式檢查", "未提供 isTypeSupported，使用瀏覽器預設格式");
              return [""];
            }
            const supported = candidates.filter((type) => {
              try {
                const supported = MediaRecorder.isTypeSupported(type);
                addDiagnostic("格式檢查", `${type} — ${supported ? "支援" : "不支援"}`);
                return supported;
              } catch (error) {
                diagnosticWarning("[錄音] 檢查格式失敗", type, error);
                return false;
              }
            });
            // 指定格式均失敗後，最後嘗試瀏覽器預設格式。
            return [...supported, ""];
          }

          function extensionForMimeType(mimeType) {
            const normalized = trimmed(mimeType).toLowerCase().split(";")[0];
            return (
              {
                "audio/webm": "webm",
                "audio/mp4": "m4a",
                "audio/ogg": "ogg",
                "audio/mpeg": "mp3",
                "audio/wav": "wav",
                "audio/x-wav": "wav",
                "audio/aac": "aac",
              }[normalized] || "webm"
            );
          }

          function inferMimeTypeFromFilename(filename) {
            const extension = trimmed(filename).toLowerCase().split(".").pop();
            return (
              {
                webm: "audio/webm",
                m4a: "audio/mp4",
                mp4: "audio/mp4",
                mp3: "audio/mpeg",
                wav: "audio/wav",
                ogg: "audio/ogg",
                oga: "audio/ogg",
                aac: "audio/aac",
              }[extension] || ""
            );
          }

          async function startRecording() {
            if (
              !canRecordAudio ||
              isRequestingMicrophone.value ||
              isRecording.value
            )
              return;
            const requestId = ++mediaRequestId;
            isRequestingMicrophone.value = true;
            audioErrorMessage.value = "";
            let stage = "取得麥克風";
            let requestedStream = null;
            addDiagnostic("開始錄音", "準備取得麥克風");

            try {
              requestedStream = await navigator.mediaDevices.getUserMedia(
                { audio: true }
              );
              if (requestId !== mediaRequestId || !isComponentActive) {
                requestedStream.getTracks().forEach((track) => track.stop());
                return;
              }
              mediaStream = requestedStream;
              addDiagnostic("取得麥克風", "成功");
              let lastError = null;
              let startedRecorder = null;
              for (const mimeType of recordingMimeTypes()) {
                let recorder = null;
                let attemptActive = true;
                const sessionChunks = [];
                try {
                  stage = "建立錄音器";
                  addDiagnostic(stage, `嘗試 ${mimeType || "瀏覽器預設格式"}`);
                  recorder = mimeType
                    ? new MediaRecorder(requestedStream, { mimeType })
                    : new MediaRecorder(requestedStream);
                  addDiagnostic(stage, "成功");
                  recorder.addEventListener("dataavailable", (event) => {
                    if (
                      attemptActive && requestId === mediaRequestId &&
                      isComponentActive && event.data && event.data.size > 0
                    )
                      sessionChunks.push(event.data);
                  });
                  recorder.addEventListener(
                    "stop",
                    () => {
                      // 失敗格式的 stop 事件不能關閉下一次嘗試的麥克風。
                      if (!attemptActive) return;
                      attemptActive = false;
                      requestedStream.getTracks().forEach((track) => track.stop());
                      if (mediaStream === requestedStream) mediaStream = null;
                      if (requestId !== mediaRequestId || !isComponentActive)
                        return;
                      stopRecordingTimer();
                      addDiagnostic("停止錄音", "完成，已釋放麥克風");
                      const actualMimeType =
                        trimmed(recorder.mimeType) ||
                        trimmed(sessionChunks[0] && sessionChunks[0].type) ||
                        "audio/webm";
                      if (mediaRecorder === recorder) mediaRecorder = null;
                      isRecording.value = false;
                      try {
                        const blob = new Blob(sessionChunks, { type: actualMimeType });
                        addDiagnostic("產生音檔", `格式 ${actualMimeType}，大小 ${blob.size} bytes`);
                        if (blob.size > 0) {
                          setAudioSelection(
                            blob,
                            `visit-${Date.now()}.${extensionForMimeType(actualMimeType)}`,
                            actualMimeType
                          );
                        } else {
                          addDiagnostic("產生音檔失敗", "音檔為空", { name: "EmptyAudio", message: "未錄到有效音訊" });
                          audioErrorMessage.value = "未錄到有效音訊，請重新錄音。";
                        }
                      } catch (error) {
                        diagnosticWarning("[錄音] 產生音檔失敗", error);
                        audioErrorMessage.value =
                          "錄音過程發生錯誤，請重新錄音或改用既有音檔。";
                      }
                    },
                    { once: true }
                  );
                  recorder.addEventListener(
                    "error",
                    (event) => {
                      if (!attemptActive) return;
                      attemptActive = false;
                      diagnosticWarning("[錄音] 錄音過程失敗", event.error || event);
                      try {
                        if (recorder.state !== "inactive") recorder.stop();
                      } catch (error) {
                        diagnosticWarning("[錄音] 錯誤後停止錄音器失敗", error);
                      }
                      requestedStream.getTracks().forEach((track) => track.stop());
                      if (mediaStream === requestedStream) mediaStream = null;
                      if (requestId !== mediaRequestId || !isComponentActive)
                        return;
                      stopRecordingTimer();
                      if (mediaRecorder === recorder) mediaRecorder = null;
                      isRecording.value = false;
                      audioErrorMessage.value =
                        "錄音過程發生錯誤，請重新錄音或改用既有音檔。";
                    },
                    { once: true }
                  );
                  stage = "啟動錄音";
                  addDiagnostic(stage, `嘗試 ${mimeType || "瀏覽器預設格式"}`);
                  recorder.start();
                  addDiagnostic(stage, `成功，實際格式 ${recorder.mimeType || "未提供"}`);
                  startedRecorder = recorder;
                  break;
                } catch (error) {
                  attemptActive = false;
                  lastError = error;
                  diagnosticWarning(`[錄音] ${stage}失敗（${mimeType || "預設格式"}）`, error);
                  // 只停止這次失敗的錄音器；串流留給下一個格式使用。
                  if (recorder && recorder.state !== "inactive") {
                    try { recorder.stop(); }
                    catch (stopError) {
                      diagnosticWarning("[錄音] 清理失敗格式的錄音器失敗", stopError);
                    }
                  }
                }
              }
              if (!startedRecorder) throw lastError || new Error("沒有可用的錄音格式");
              mediaRecorder = startedRecorder;
              stage = "更新錄音狀態";
              resetAudioSelection();
              isRecording.value = true;
              recordingSeconds.value = 0;
              recordingTimerId = window.setInterval(() => {
                recordingSeconds.value += 1;
              }, 1000);
            } catch (error) {
              diagnosticWarning(`[錄音] ${stage}失敗`, error);
              if (requestId !== mediaRequestId || !isComponentActive) {
                if (requestedStream)
                  requestedStream.getTracks().forEach((track) => track.stop());
                return;
              }
              // 使尚未送達的錄音器事件失效，避免覆蓋錯誤或原音檔。
              mediaRequestId += 1;
              if (mediaRecorder && mediaRecorder.state !== "inactive") {
                try { mediaRecorder.stop(); }
                catch (stopError) { diagnosticWarning("[錄音] 清理錄音器失敗", stopError); }
              }
              stopMediaTracks();
              stopRecordingTimer();
              mediaRecorder = null;
              isRecording.value = false;
              isRequestingMicrophone.value = false;
              audioErrorMessage.value =
                "無法使用麥克風，原音檔已保留；請確認權限，或改用既有音檔。";
            } finally {
              if (requestId === mediaRequestId)
                isRequestingMicrophone.value = false;
            }
          }

          function stopRecording() {
            if (!mediaRecorder || mediaRecorder.state === "inactive") return;
            try {
              addDiagnostic("停止錄音", "等待最後的音訊資料");
              mediaRecorder.stop();
              stopRecordingTimer();
              // 保留串流，等最後的 dataavailable 與 stop 事件完成才釋放。
            } catch (error) {
              diagnosticWarning("[錄音] 停止錄音失敗", error);
              mediaRequestId += 1;
              stopMediaTracks();
              stopRecordingTimer();
              mediaRecorder = null;
              isRecording.value = false;
              audioErrorMessage.value =
                "錄音過程發生錯誤，請重新錄音或改用既有音檔。";
            }
          }

          function openAudioFilePicker() {
            if (
              isRequestingMicrophone.value ||
              isRecording.value
            )
              return;
            if (audioFileInput.value) {
              addDiagnostic("開啟音檔選擇器", "已送出開啟請求");
              try { audioFileInput.value.click(); }
              catch (error) { diagnosticWarning("[錄音] 開啟音檔選擇器失敗", error); }
            }
          }

          function selectAudioFile(event) {
            if (
              isRequestingMicrophone.value ||
              isRecording.value
            )
              return;
            const input = event && event.target;
            const file = input && input.files && input.files[0];
            if (!file) {
              addDiagnostic("選擇音檔", "沒有取得檔案");
              return;
            }
            addDiagnostic("選擇音檔", `檔名 ${file.name}，原始類型 ${file.type || "未提供"}，大小 ${file.size} bytes`);

            const mimeType =
              trimmed(file.type) || inferMimeTypeFromFilename(file.name);
            if (!mimeType || !mimeType.startsWith("audio/")) {
              addDiagnostic("音檔格式驗證失敗", `類型 ${mimeType || "未提供"}`, { name: "UnsupportedFileType", message: "無法判斷音檔格式" });
              audioErrorMessage.value =
                "無法判斷音檔格式，請選擇常見的音訊檔案。";
              input.value = "";
              return;
            }
            try {
              setAudioSelection(
                file,
                trimmed(file.name) || `visit.${extensionForMimeType(mimeType)}`,
                mimeType
              );
            } catch (error) {
              diagnosticWarning("[錄音] 顯示所選音檔失敗", error);
            }
            input.value = "";
          }

          function cleanupMediaResources() {
            mediaRequestId += 1;
            isRequestingMicrophone.value = false;
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
              try { mediaRecorder.stop(); }
              catch (error) { diagnosticWarning("[錄音] 離開頁面時停止錄音失敗", error); }
            }
            mediaRecorder = null;
            isRecording.value = false;
            stopRecordingTimer();
            stopMediaTracks();
            revokeAudioObjectUrl();
          }

          function handlePageShow(event) {
            if (event.persisted && hasAudio.value && !audioObjectUrl.value) {
              audioObjectUrl.value = URL.createObjectURL(audioBlob.value);
            }
          }

          onMounted(() => {
            window.addEventListener("pagehide", cleanupMediaResources);
            window.addEventListener("pageshow", handlePageShow);
          });
          onBeforeUnmount(() => {
            isComponentActive = false;
            window.removeEventListener("pagehide", cleanupMediaResources);
            window.removeEventListener("pageshow", handlePageShow);
            cleanupMediaResources();
          });
          return {
            canRecordAudio, isRequestingMicrophone, isRecording, hasAudio,
            recordingDurationLabel, audioStatusMessage, audioFileInput,
            audioObjectUrl, audioFilename, audioErrorMessage,
            diagnosticEnvironment, latestDiagnosticError, diagnosticLogText,
            diagnosticCopyStatus, manualCopyText, copyDiagnostics, clearDiagnostics,
            recordPlaybackError,
            startRecording, stopRecording, openAudioFilePicker, selectAudioFile,
          };
        },
      });

      function mergeThemeTokens(base, overrides) {
        if (!base || typeof base !== "object" || Array.isArray(base)) {
          return overrides;
        }
        const merged = { ...base };
        Object.entries(overrides).forEach(([key, value]) => {
          merged[key] =
            value && typeof value === "object" && !Array.isArray(value)
              ? mergeThemeTokens(base[key], value)
              : value;
        });
        return merged;
      }

      const CLIENT_THEME = mergeThemeTokens(PrimeUIX.Themes.Lara, {
        semantic: {
          primary: {
            50: "#fbf6f2",
            100: "#f3e8df",
            200: "#e7d2c2",
            300: "#d7b39d",
            400: "#c28c70",
            500: "#a9684e",
            600: "#895b45",
            700: "#6c4939",
            800: "#61372b",
            900: "#4f3027",
            950: "#2b1712",
          },
          colorScheme: {
            light: {
              primary: {
                color: "#895b45",
                inverseColor: "#fffdfa",
                hoverColor: "#6c4939",
                activeColor: "#61372b",
              },
              surface: {
                0: "#fffdfa",
                50: "#faf7f3",
                100: "#f4ede6",
                200: "#e8dbd0",
                300: "#d8c6b7",
                400: "#bda796",
                500: "#9c8575",
                600: "#7a685c",
                700: "#5e5047",
                800: "#433934",
                900: "#302925",
                950: "#1d1816",
              },
            },
          },
        },
      });

      app.use(PrimeVue.Config, {
        theme: {
          preset: CLIENT_THEME,
          options: { darkModeSelector: false },
        },
      });
      app.component("p-button", PrimeVue.Button);
      app.mount("#app");
    </script>
  </body>
</html>
